name: deploy

# Vercel's own Git integration already deploys every push to main, and every PR as
# a preview. This workflow does NOT duplicate that — a second deploy path means two
# sources of truth for what is live, and the one that is red is rarely the one that
# shipped.
#
# What lives here is the thing Vercel cannot do: gate G5. A production release must
# carry a named human authorisation, and its absence is the point.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [preview, production]
        default: preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          missing=
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]              || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ]          || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing"
            echo "Without project linkage the CLI cannot tell which project to deploy,"
            echo "and prompts — which in CI reads as 'requires confirmation'."
            exit 1
          fi

      # Gate G5. Held by a person, deliberately.
      - name: Release gate
        if: inputs.environment == 'production'
        env: { RELEASE_APPROVAL: "${{ vars.RELEASE_APPROVAL }}" }
        run: |
          test -n "$RELEASE_APPROVAL" || {
            echo "::error::RELEASE_APPROVAL is unset — no named authorisation for this release"
            exit 2; }
          echo "release authorised by: $RELEASE_APPROVAL"

      # --yes is required in CI: without it the CLI asks for confirmation and exits 1.
      - run: npx vercel deploy --yes ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
